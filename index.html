<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title><!--@title--></title>
  <meta name="description" content="<!--@description-->">
  <meta name="author" content="Evyatar Swissa">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080a0e">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="<!--@title-->">
  <meta property="og:description" content="<!--@description-->">
  <meta property="og:url" content="https://swissclock.github.io/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;1,6..72,300&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="preload" as="fetch" href="/data/brain-shell.bin" crossorigin>
</head>
<body>
  <a class="skip" href="#lede">Skip to content</a>

  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <header class="rail">
    <div class="who">Evyatar Swissa<i>Neuroscientist</i></div>
    <nav id="nav" aria-label="Sections"><!--@nav--></nav>
    <div class="meter" aria-hidden="true">
      <div class="k"><span>Signal</span><b id="m-state">resting</b></div>
      <div class="track"><i id="m-bar"></i></div>
      <div class="k"><span>Release</span><b id="m-value">100%</b></div>
    </div>
  </header>

  <main id="main">
<!--@sections-->
  </main>

  <footer><!--@footer--></footer>

  <p class="hint" id="hint">Hold to deliver light</p>
  <button class="stim" id="stim" aria-describedby="stim-help">
    <span class="lamp" aria-hidden="true"></span>
    <span class="txt"><b id="stim-label">620 nm · hold</b><i>eOPN3 · Gi/o</i></span>
  </button>
  <p id="stim-help" class="sr-only">
    Press and hold to deliver light to the model. Suppression persists after release and recovers on its own.
  </p>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
